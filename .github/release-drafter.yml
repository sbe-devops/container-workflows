name-template: "$NEXT_PATCH_VERSION"
tag-template: "$NEXT_PATCH_VERSION"

# CalVer: vYY.M.N — year and month are set manually at publish time.
# Release Drafter increments N (the patch component) automatically.
# When a new month starts, edit the tag to vYY.M.0 before publishing.

categories:
  - title: "💥 Breaking Changes"
    labels: ["breaking"]
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Bug Fixes"
    labels: ["bug", "fix"]
  - title: "📦 Build & CI"
    labels: ["build", "ci", "dockerfile"]
  - title: "🔧 Maintenance"
    labels: ["maintenance", "chore", "dependencies"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feature", "enhancement"]
  patch:
    labels: ["bug", "fix", "build", "ci", "dockerfile", "maintenance", "chore", "dependencies"]
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: $PREVIOUS_TAG...https://github.com/sbe-devops/container-workflows/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
