name: Docker Build and Push

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: Full ECR repository URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/my-image)
        required: true
        type: string
      role_arn:
        description: IAM role ARN to assume for ECR authentication (OIDC)
        required: true
        type: string
      image_tag:
        description: Release tag (e.g. v26.5.0). Combined with runtime version when version_extract_command is set.
        required: true
        type: string
      push:
        description: Push image to ECR after build. Set false for PR build verification.
        required: false
        type: boolean
        default: true
      run_tests:
        description: Run container structure tests before push.
        required: false
        type: boolean
        default: false
      test_config:
        description: Path to container-structure-test config file.
        required: false
        type: string
        default: tests/structure-test.yaml
      version_extract_command:
        description: Command to run inside the built image to extract the runtime version (e.g. "python3 --version"). When set, the pushed tag becomes "<version>-<image_tag>" (e.g. "3.11.15-v26.5.0").
        required: false
        type: string
        default: ""
      version_extract_pattern:
        description: Regex passed to grep -oE to extract the version string from version_extract_command output. Defaults to X.Y.Z semver.
        required: false
        type: string
        default: "[0-9]+\\.[0-9]+\\.[0-9]+"
      trivy_scan:
        description: Run Trivy vulnerability scan after build. Fails on findings at or above trivy_severity.
        required: false
        type: boolean
        default: false
      trivy_severity:
        description: Comma-separated severity levels that fail the build (e.g. HIGH,CRITICAL).
        required: false
        type: string
        default: HIGH,CRITICAL
      sbom:
        description: Generate a CycloneDX SBOM for the image and attach it as a Cosign attestation after push.
        required: false
        type: boolean
        default: false
      sign:
        description: Keyless sign the image with Cosign after push.
        required: false
        type: boolean
        default: false
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      build_context:
        description: Docker build context path
        required: false
        type: string
        default: .
      build_args:
        description: Build arguments, one per line (KEY=VALUE)
        required: false
        type: string
        default: ""
      pull:
        description: >
          Re-resolve every FROM ref against the registry instead of trusting a locally cached
          base. DEFAULTS TO TRUE, and should stay true for anything building on a moving tag
          (:latest, :2023). Set false only for a deliberately frozen, bit-reproducible build.
        required: false
        type: boolean
        default: true
      base_image_role_arn:
        description: Optional IAM role ARN in a second account to assume before build so Docker can pull cross-account base images. When set, a second configure-aws-credentials + ecr-login step runs before the build, then primary credentials are restored.
        required: false
        type: string
        default: ""
      extra_repo:
        description: Optional additional repo to check out into the build context before the Docker build (owner/repo format, e.g. my-org/my-lib). Use with extra_repo_ref and extra_repo_path.
        required: false
        type: string
        default: ""
      extra_repo_ref:
        description: Ref (tag, branch, or SHA) to check out for extra_repo. Defaults to the repo's default branch when not set.
        required: false
        type: string
        default: ""
      extra_repo_path:
        description: Path within the workspace to check out extra_repo into. Defaults to "extra-repo". This directory will be included in the Docker build context.
        required: false
        type: string
        default: "extra-repo"
      extra_repo_app_client_id:
        description: GitHub App client ID used to mint a short-lived installation token for the extra_repo checkout. Pass the public client ID via a repo/org variable (e.g. vars.MY_APP_CLIENT_ID). Pair with extra_repo_app_private_key in the secrets block. Not required for public extra_repo.
        required: false
        type: string
        default: ""
      aws_region:
        description: AWS region for ECR
        required: false
        type: string
        default: us-east-1
      verify_command:
        description: >
          Optional shell command, run in the caller's checked-out workspace on the tested image
          (built, scanned and structure-tested), BEFORE any push. `IMAGE` holds its local ref. A
          non-zero exit fails the run, so nothing is pushed. For a check that has to run the
          image itself (e.g. an MCP engine's tools/list) and that a structure test cannot
          express. Runs on every event, PR builds included. It runs in a SEPARATE job, `verify`,
          that never holds a credential: no id-token permission, no AWS step, no registry login,
          no persisted checkout token. The image reaches it as a checksummed file. With it set,
          the push moves to a third job that rebuilds and must match the tested manifest.
        required: false
        type: string
        default: ""
      verify_artifact:
        description: >
          Optional path (relative to the workspace) that verify_command writes. Uploaded as the
          artifact `verify-<image_tag>` for 30 days, so a release can quote what was measured.
          Missing after a successful verify_command fails the job. The artifact name must be
          unique in the run: a matrix whose legs share image_tag (no version_extract_command)
          collides, and upload-artifact refuses the second upload.
        required: false
        type: string
        default: ""
    secrets:
      extra_repo_app_private_key:
        description: GitHub App private key for the App identified by extra_repo_app_client_id. Used to mint an installation token in-job for the extra_repo checkout. Not required for public extra_repo.
        required: false
    outputs:
      image_tag:
        description: The final image tag pushed to ECR (e.g. "3.11.15-v26.5.0" or the raw image_tag if no version extraction).
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: >
          The pushed image's digest (sha256:...), the same one signed and attested. Empty when
          push is false. Consumers that run an image by digest (never by tag) read it here.
        value: ${{ jobs.build.outputs.image_digest || jobs.push.outputs.image_digest }}

env:
  TEST_IMAGE: test-image:${{ inputs.image_tag }}
  # No leading "v" — gh-setup-container-structure-test takes a bare version and
  # builds the tag itself. This is an internal env, not a workflow_call input, so
  # dropping the prefix changes nothing for callers.
  CST_VERSION: 1.22.1

jobs:
  build:
    name: ${{ inputs.push && inputs.verify_command == '' && 'Build and Push' || 'Build' }}
    runs-on: ubuntu-24.04-arm
    # Hang protection, not a budget — build + Trivy scan + SBOM + structure tests + push + sign + attest; observed max 3 min.
    # Without this a stuck job runs to GitHub's 360-minute default.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.final_tag.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.digest }}
      tested_manifest: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.digest'] }}
      tested_id: ${{ steps.save.outputs.image_id }}
      tested_tar_sha256: ${{ steps.save.outputs.sha256 }}
    steps:
      # 🔴 CALLER INPUTS ARE DATA. Every value reaches a script through env: and is quoted,
      # never pasted into run: with an expression (tests/no-expr-in-run.py fails the build if
      # one is). image_tag is also held to Docker's tag grammar here, BEFORE any credentialed
      # step: a tag like `v1$(…)` is refused, not run (PROOF, corp 1a99223).
      - name: Check caller inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ECR_REPOSITORY_URL: ${{ inputs.ecr_repository_url }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid image tag (letters, digits, _ . -, at most 128, not starting with . or -)"
            exit 1
          fi
          # ecr_repository_url reaches security-actions' sign/attest, whose composite steps
          # still paste their image-ref into run: (sweep, 2026-11-14). Held to the ECR shape
          # here, so nothing but a registry path can arrive there from this workflow.
          if ! [[ "$ECR_REPOSITORY_URL" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9][a-z0-9._/-]{0,255}$ ]]; then
            echo "::error::ecr_repository_url is not an ECR repository URL (<account>.dkr.ecr.<region>.amazonaws.com/<name>)"
            exit 1
          fi
          echo "✓ image_tag $IMAGE_TAG, repository $ECR_REPOSITORY_URL"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Mint extra_repo token
        if: inputs.extra_repo != '' && inputs.extra_repo_app_client_id != ''
        id: extra_repo_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.extra_repo_app_client_id }}
          private-key: ${{ secrets.extra_repo_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout extra repo
        if: inputs.extra_repo != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.extra_repo }}
          ref: ${{ inputs.extra_repo_ref }}
          path: ${{ inputs.extra_repo_path }}
          token: ${{ steps.extra_repo_token.outputs.token || github.token }}

      - name: Configure AWS credentials (base image registry)
        if: inputs.base_image_role_arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.base_image_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to base image ECR
        if: inputs.base_image_role_arn != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── `pull` IS BELT-AND-BRACES HERE. IT IS NOT FIXING A DEFECT. ────────────────
      #
      # 🔴 IF YOU ARE HERE BECAUSE SOMEONE REPORTED "consumers rebuild on a stale base
      #    because pull: is missing" — THAT WAS INVESTIGATED ON 2026-09-02 AND IT IS NOT
      #    HAPPENING. Do not re-litigate it. The measurement:
      #
      #      csi-python v26.8.0  #6 resolve …/csi-amazonlinux/amazonlinux:latest@sha256:8c2fb90e… done
      #      csi-python v26.9.0  #6 resolve …/csi-amazonlinux/amazonlinux:latest@sha256:ae4f67a6… done
      #
      #    DIFFERENT DIGESTS, AND `pull:` WAS NOT SET FOR EITHER. Every build emits
      #    `[internal] load metadata for …:latest` first — BuildKit re-resolves the tag
      #    against the registry every run. `setup-buildx-action` uses the docker-container
      #    driver, which has NO local image store to serve a stale base from, on a runner
      #    that is fresh anyway.
      #
      # ⚠️ THE REPORT'S EVIDENCE DID NOT SUPPORT IT. A re-run touching a `type=gha` cache
      #    blob is `cache-from` working as designed — equally consistent with "base
      #    re-resolved, unchanged, layers legitimately hit." The re-run that prompted it
      #    failed identically because csi-python/python3-14:latest HAD NOT BEEN PROMOTED.
      #    The observation was right; the cause was invented.
      #
      # So why keep it: it is one word, it costs a manifest check already being made, and it
      # WOULD matter on the `docker` driver with a warm daemon (a self-hosted runner). The
      # input exists so a caller wanting a frozen, bit-reproducible base can turn it off.
      # It does NOT disable the layer cache — it re-resolves FROM refs only.
      - name: Build (load for testing)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          pull: ${{ inputs.pull }}
          tags: ${{ env.TEST_IMAGE }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract runtime version
        if: inputs.version_extract_command != ''
        id: runtime_version
        env:
          VERSION_EXTRACT_COMMAND: ${{ inputs.version_extract_command }}
          VERSION_EXTRACT_PATTERN: ${{ inputs.version_extract_pattern }}
        run: |
          set -uo pipefail
          # The command runs INSIDE the image, as argv words: split on whitespace, no glob,
          # and nothing in it is evaluated by this shell.
          read -r -a cmd <<< "$VERSION_EXTRACT_COMMAND"
          OUTPUT=$(docker run --rm --entrypoint '' "$TEST_IMAGE" "${cmd[@]}" 2>&1)
          SEMVER=$(echo "$OUTPUT" | grep -oE -- "$VERSION_EXTRACT_PATTERN" | head -1 || true)
          if [ -z "$SEMVER" ]; then
            echo "ERROR: could not extract version from: $OUTPUT"
            exit 1
          fi
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "✓ Runtime version: $SEMVER"

      - name: Resolve final image tag
        id: final_tag
        env:
          SEMVER: ${{ steps.runtime_version.outputs.semver }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$SEMVER" ]; then final="$SEMVER-$IMAGE_TAG"; else final="$IMAGE_TAG"; fi
          # The prefix comes from the image's own output: hold the result to the tag grammar too.
          if ! [[ "$final" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::the resolved tag is not a valid image tag"
            exit 1
          fi
          echo "image_tag=$final" >> "$GITHUB_OUTPUT"
          echo "✓ Final tag: $(cat $GITHUB_OUTPUT | grep image_tag | cut -d= -f2)"

      - name: Scan image
        if: inputs.trivy_scan
        uses: sbe-devops/security-actions/.github/actions/scan@v0.4.1
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          severity: ${{ inputs.trivy_severity }}

      - name: Generate SBOM
        if: inputs.sbom
        id: sbom
        uses: sbe-devops/security-actions/.github/actions/sbom@v0.4.1
        with:
          image-ref: ${{ env.TEST_IMAGE }}

      # Was an inline `curl` of the release binary — verified by nothing, invisible
      # to Renovate, and the same install duplicated across repos. Now a tier-3 SBE
      # gh-setup-<tool> action that checks the download against the project's
      # published checksums and fails closed (standards/github-actions.md,
      # "Installing tools in workflows"). container-structure-test ships no vendor
      # setup action, so tier 3 is the correct rung here, not a shortcut.
      - name: Set up container-structure-test
        if: inputs.run_tests
        uses: sbe-devops/gh-setup-container-structure-test@v0.1.0
        with:
          version: ${{ env.CST_VERSION }}

      - name: Run structure tests
        if: inputs.run_tests
        env:
          TEST_CONFIG: ${{ inputs.test_config }}
        run: |
          container-structure-test test \
            --image "$TEST_IMAGE" \
            --config "$TEST_CONFIG"

      # ── With a verify_command, the caller's code never runs in THIS job ────────────
      # This job holds the release role's AWS session and the OIDC token-request pair, and a
      # child process can read them from its parent's /proc/<pid>/environ whatever `env -u`
      # removed from its own (PROOF measured it on #22). So the tested image leaves this job
      # as a file, checksummed, and the caller's command runs in `verify`, a job with no
      # id-token permission, no AWS step and no registry login.
      - name: Save the tested image for the verify job
        if: inputs.verify_command != ''
        id: save
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tested-image"
          mkdir -p "$out"
          docker save "$TEST_IMAGE" -o "$out/image.tar"
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out/image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the tested image
        if: inputs.verify_command != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ steps.final_tag.outputs.image_tag }}
          path: ${{ runner.temp }}/tested-image/image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload the SBOM for the push job
        if: inputs.verify_command != '' && inputs.push && inputs.sbom
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.final_tag.outputs.image_tag }}
          path: ${{ steps.sbom.outputs.sbom-file }}
          if-no-files-found: error
          retention-days: 1

      - name: Push to ECR
        if: (inputs.push) && inputs.verify_command == ''
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          # Both steps, not just the tested one. This is the build whose output ships;
          # if only the test build re-resolved, the PUSHED image could still carry a
          # stale base — the worse half of the same defect.
          pull: ${{ inputs.pull }}
          tags: ${{ inputs.ecr_repository_url }}:${{ steps.final_tag.outputs.image_tag }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The push is a SECOND build. It equals the tested build only on a full cache hit with
      # an unmoved base. Before anything is signed, check that the pushed linux/arm64
      # manifest IS the one that was tested, scanned and verified: equal manifest digests
      # mean the same config and layers. (buildx 0.30's metadata carries containerimage.digest
      # and .descriptor, not a config digest: measured, #22.)
      - name: The pushed image is the tested image
        if: (inputs.push) && inputs.verify_command == ''
        env:
          REPO_URL: ${{ inputs.ecr_repository_url }}
          TESTED: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.digest'] }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "$TESTED" "$PUSHED"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not a digest: '$d' (tested '$TESTED', pushed '$PUSHED')"; exit 1; }
          done
          # An index (provenance on, the default) names its linux/arm64 manifest; a bare
          # manifest is itself.
          child="$(docker buildx imagetools inspect --raw "${REPO_URL}@${PUSHED}" | jq -r --arg self "$PUSHED" '
            if .manifests then [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest]
            else [$self] end | if length == 1 then .[0] else error("expected one linux/arm64 manifest, found \(length)") end')"
          if [ "$child" != "$TESTED" ]; then
            echo "::error::the pushed linux/arm64 manifest $child is NOT the tested one $TESTED: the second build differed (base moved or a cache miss). Nothing was signed; re-cut the release."
            exit 1
          fi
          echo "✓ pushed ${REPO_URL}@${PUSHED} carries the tested manifest $TESTED"

      - name: Sign image
        if: (inputs.push && inputs.sign) && inputs.verify_command == ''
        uses: sbe-devops/security-actions/.github/actions/sign@v0.4.1
        with:
          image-ref: ${{ inputs.ecr_repository_url }}@${{ steps.push.outputs.digest }}

      - name: Attest SBOM
        if: (inputs.push && inputs.sbom) && inputs.verify_command == ''
        uses: sbe-devops/security-actions/.github/actions/attest@v0.4.1
        with:
          image-ref: ${{ inputs.ecr_repository_url }}@${{ steps.push.outputs.digest }}
          sbom-file: ${{ steps.sbom.outputs.sbom-file }}

      - name: Record the digest
        if: (inputs.push) && inputs.verify_command == ''
        env:
          REPO_URL: ${{ inputs.ecr_repository_url }}
          TAG: ${{ steps.final_tag.outputs.image_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::the push returned no sha256 digest ('$DIGEST')"; exit 1 ;;
          esac
          {
            echo "### Pushed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${REPO_URL}:${TAG}\` |"
            echo "| digest | \`${REPO_URL}@${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The caller's own check on the tested image, in a job that holds NO credential: no
  # id-token permission (so no ACTIONS_ID_TOKEN_REQUEST_*), no AWS step, no registry login,
  # and a checkout that keeps no token. It sees the image only as the file `build` saved,
  # checked against that job's sha256 and image id before anything runs.
  verify:
    name: Verify (no credentials)
    needs: build
    if: inputs.verify_command != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # GitHub-hosted runners ship a Docker Hub login in ~/.docker/config.json: an auth entry
      # for https://index.docker.io/v1/, in every job, including this one (measured on #22,
      # tests/credential-probe.sh). This job pulls nothing (the image arrives as a file), so
      # the file goes before any caller code runs.
      - name: Drop the runner's preset registry login
        run: |
          set -euo pipefail
          rm -f "$HOME/.docker/config.json"
          [ ! -e "$HOME/.docker/config.json" ]
          echo "✓ no registry login on this runner"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image-${{ needs.build.outputs.image_tag }}
          path: ${{ runner.temp }}/tested-image

      - name: Load it, and check it is the tested image
        env:
          WANT_SHA256: ${{ needs.build.outputs.tested_tar_sha256 }}
          WANT_ID: ${{ needs.build.outputs.tested_id }}
        run: |
          set -euo pipefail
          tar="$RUNNER_TEMP/tested-image/image.tar"
          got="$(sha256sum "$tar" | cut -d' ' -f1)"
          [ "$got" = "$WANT_SHA256" ] || { echo "::error::the image file's sha256 is $got, build saved $WANT_SHA256"; exit 1; }
          docker load -i "$tar"
          id="$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")"
          [ "$id" = "$WANT_ID" ] || { echo "::error::loaded image id $id, build tested $WANT_ID"; exit 1; }
          echo "✓ $TEST_IMAGE is the tested image ($id)"

      # The caller's own check on the tested image. The command reaches bash through env,
      # never through ${{ }} in the script body, so its text is data to the shell. There is
      # nothing to strip from its environment: this job never held a credential.
      - name: Verify (caller's command)
        env:
          IMAGE: ${{ env.TEST_IMAGE }}
          VERIFY_COMMAND: ${{ inputs.verify_command }}
          VERIFY_ARTIFACT: ${{ inputs.verify_artifact }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$VERIFY_COMMAND"
          if [ -n "$VERIFY_ARTIFACT" ] && [ ! -s "$VERIFY_ARTIFACT" ]; then
            echo "::error::verify_command succeeded but did not write verify_artifact '$VERIFY_ARTIFACT'"
            exit 1
          fi

      - name: Upload verify artifact
        if: inputs.verify_artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ needs.build.outputs.image_tag }}
          path: ${{ inputs.verify_artifact }}
          if-no-files-found: error
          retention-days: 30

  # With a verify_command, the push waits for `verify` and REBUILDS (the tested image never
  # holds a credential-bearing job's attention again). "The pushed image is the tested image"
  # then binds this build to the one `build` tested, before anything is signed.
  push:
    name: Push
    needs: [build, verify]
    if: inputs.push && inputs.verify_command != '' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mint extra_repo token
        if: inputs.extra_repo != '' && inputs.extra_repo_app_client_id != ''
        id: extra_repo_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.extra_repo_app_client_id }}
          private-key: ${{ secrets.extra_repo_app_private_key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout extra repo
        if: inputs.extra_repo != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.extra_repo }}
          ref: ${{ inputs.extra_repo_ref }}
          path: ${{ inputs.extra_repo_path }}
          token: ${{ steps.extra_repo_token.outputs.token || github.token }}

      - name: Configure AWS credentials (base image registry)
        if: inputs.base_image_role_arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.base_image_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to base image ECR
        if: inputs.base_image_role_arn != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push to ECR
        if: inputs.push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          # Both steps, not just the tested one. This is the build whose output ships;
          # if only the test build re-resolved, the PUSHED image could still carry a
          # stale base — the worse half of the same defect.
          pull: ${{ inputs.pull }}
          tags: ${{ inputs.ecr_repository_url }}:${{ needs.build.outputs.image_tag }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The push is a SECOND build. It equals the tested build only on a full cache hit with
      # an unmoved base. Before anything is signed, check that the pushed linux/arm64
      # manifest IS the one that was tested, scanned and verified: equal manifest digests
      # mean the same config and layers. (buildx 0.30's metadata carries containerimage.digest
      # and .descriptor, not a config digest: measured, #22.)
      - name: The pushed image is the tested image
        if: inputs.push
        env:
          REPO_URL: ${{ inputs.ecr_repository_url }}
          TESTED: ${{ needs.build.outputs.tested_manifest }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for d in "$TESTED" "$PUSHED"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not a digest: '$d' (tested '$TESTED', pushed '$PUSHED')"; exit 1; }
          done
          # An index (provenance on, the default) names its linux/arm64 manifest; a bare
          # manifest is itself.
          child="$(docker buildx imagetools inspect --raw "${REPO_URL}@${PUSHED}" | jq -r --arg self "$PUSHED" '
            if .manifests then [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest]
            else [$self] end | if length == 1 then .[0] else error("expected one linux/arm64 manifest, found \(length)") end')"
          if [ "$child" != "$TESTED" ]; then
            echo "::error::the pushed linux/arm64 manifest $child is NOT the tested one $TESTED: the second build differed (base moved or a cache miss). Nothing was signed; re-cut the release."
            exit 1
          fi
          echo "✓ pushed ${REPO_URL}@${PUSHED} carries the tested manifest $TESTED"

      - name: Download the SBOM
        if: inputs.sbom
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ needs.build.outputs.image_tag }}
          path: ${{ runner.temp }}/sbom

      - name: Locate the SBOM
        if: inputs.sbom
        id: sbom_file
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/sbom" -type f)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one SBOM file, found ${#files[@]}"; exit 1; }
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Sign image
        if: inputs.push && inputs.sign
        uses: sbe-devops/security-actions/.github/actions/sign@v0.4.1
        with:
          image-ref: ${{ inputs.ecr_repository_url }}@${{ steps.push.outputs.digest }}

      - name: Attest SBOM
        if: inputs.push && inputs.sbom
        uses: sbe-devops/security-actions/.github/actions/attest@v0.4.1
        with:
          image-ref: ${{ inputs.ecr_repository_url }}@${{ steps.push.outputs.digest }}
          sbom-file: ${{ steps.sbom_file.outputs.path }}

      - name: Record the digest
        if: inputs.push
        env:
          REPO_URL: ${{ inputs.ecr_repository_url }}
          TAG: ${{ needs.build.outputs.image_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::the push returned no sha256 digest ('$DIGEST')"; exit 1 ;;
          esac
          {
            echo "### Pushed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${REPO_URL}:${TAG}\` |"
            echo "| digest | \`${REPO_URL}@${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
