name: Docker Build and Push

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: Full ECR repository URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/my-image)
        required: true
        type: string
      role_arn:
        description: IAM role ARN to assume for ECR authentication (OIDC)
        required: true
        type: string
      image_tag:
        description: Docker image tag (e.g. release tag or git SHA)
        required: true
        type: string
      push:
        description: Push image to ECR after build. Set false for PR build verification.
        required: false
        type: boolean
        default: true
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      build_context:
        description: Docker build context path
        required: false
        type: string
        default: .
      build_args:
        description: Build arguments, one per line (KEY=VALUE)
        required: false
        type: string
        default: ""
      aws_region:
        description: AWS region for ECR
        required: false
        type: string
        default: us-east-1

jobs:
  build:
    name: ${{ inputs.push && 'Build and Push' || 'Build' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.ecr_repository_url }}:${{ inputs.image_tag }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/arm64
