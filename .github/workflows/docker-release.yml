name: Docker Build and Push

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: Full ECR repository URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/my-image)
        required: true
        type: string
      role_arn:
        description: IAM role ARN to assume for ECR authentication (OIDC)
        required: true
        type: string
      image_tag:
        description: Release tag (e.g. v26.5.0). Combined with runtime version when version_extract_command is set.
        required: true
        type: string
      push:
        description: Push image to ECR after build. Set false for PR build verification.
        required: false
        type: boolean
        default: true
      run_tests:
        description: Run container structure tests before push.
        required: false
        type: boolean
        default: false
      test_config:
        description: Path to container-structure-test config file.
        required: false
        type: string
        default: tests/structure-test.yaml
      version_extract_command:
        description: Command to run inside the built image to extract the runtime version (e.g. "python3 --version"). When set, the pushed tag becomes "<version>-<image_tag>" (e.g. "3.11.15-v26.5.0").
        required: false
        type: string
        default: ""
      version_extract_pattern:
        description: Regex passed to grep -oE to extract the version string from version_extract_command output. Defaults to X.Y.Z semver.
        required: false
        type: string
        default: "[0-9]+\\.[0-9]+\\.[0-9]+"
      trivy_scan:
        description: Run Trivy vulnerability scan after build. Fails on findings at or above trivy_severity.
        required: false
        type: boolean
        default: false
      trivy_severity:
        description: Comma-separated severity levels that fail the build (e.g. HIGH,CRITICAL).
        required: false
        type: string
        default: HIGH,CRITICAL
      sbom:
        description: Generate a CycloneDX SBOM for the image and attach it as a Cosign attestation after push.
        required: false
        type: boolean
        default: false
      sign:
        description: Keyless sign the image with Cosign after push.
        required: false
        type: boolean
        default: false
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      build_context:
        description: Docker build context path
        required: false
        type: string
        default: .
      build_args:
        description: Build arguments, one per line (KEY=VALUE)
        required: false
        type: string
        default: ""
      base_image_role_arn:
        description: Optional IAM role ARN in a second account to assume before build so Docker can pull cross-account base images. When set, a second configure-aws-credentials + ecr-login step runs before the build, then primary credentials are restored.
        required: false
        type: string
        default: ""
      extra_repo:
        description: Optional additional repo to check out into the build context before the Docker build (owner/repo format, e.g. my-org/my-lib). Use with extra_repo_ref and extra_repo_path.
        required: false
        type: string
        default: ""
      extra_repo_ref:
        description: Ref (tag, branch, or SHA) to check out for extra_repo. Defaults to the repo's default branch when not set.
        required: false
        type: string
        default: ""
      extra_repo_path:
        description: Path within the workspace to check out extra_repo into. Defaults to "extra-repo". This directory will be included in the Docker build context.
        required: false
        type: string
        default: "extra-repo"
      aws_region:
        description: AWS region for ECR
        required: false
        type: string
        default: us-east-1
    outputs:
      image_tag:
        description: The final image tag pushed to ECR (e.g. "3.11.15-v26.5.0" or the raw image_tag if no version extraction).
        value: ${{ jobs.build.outputs.image_tag }}

env:
  TEST_IMAGE: test-image:${{ inputs.image_tag }}
  CST_VERSION: v1.22.1

jobs:
  build:
    name: ${{ inputs.push && 'Build and Push' || 'Build' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.final_tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout extra repo
        if: inputs.extra_repo != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.extra_repo }}
          ref: ${{ inputs.extra_repo_ref }}
          path: ${{ inputs.extra_repo_path }}

      - name: Configure AWS credentials (base image registry)
        if: inputs.base_image_role_arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.base_image_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to base image ECR
        if: inputs.base_image_role_arn != ''
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (load for testing)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract runtime version
        if: inputs.version_extract_command != ''
        id: runtime_version
        run: |
          OUTPUT=$(docker run --rm --entrypoint '' "${{ env.TEST_IMAGE }}" ${{ inputs.version_extract_command }} 2>&1)
          SEMVER=$(echo "$OUTPUT" | grep -oE '${{ inputs.version_extract_pattern }}' | head -1 || true)
          if [ -z "$SEMVER" ]; then
            echo "ERROR: could not extract version from: $OUTPUT"
            exit 1
          fi
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "✓ Runtime version: $SEMVER"

      - name: Resolve final image tag
        id: final_tag
        run: |
          if [ -n "${{ steps.runtime_version.outputs.semver }}" ]; then
            echo "image_tag=${{ steps.runtime_version.outputs.semver }}-${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          fi
          echo "✓ Final tag: $(cat $GITHUB_OUTPUT | grep image_tag | cut -d= -f2)"

      - name: Scan image
        if: inputs.trivy_scan
        uses: sbe-devops/security-actions/.github/actions/scan@v0.3.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          severity: ${{ inputs.trivy_severity }}

      - name: Generate SBOM
        if: inputs.sbom
        id: sbom
        uses: sbe-devops/security-actions/.github/actions/sbom@v0.1.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}

      - name: Install container-structure-test
        if: inputs.run_tests
        run: |
          curl -fsSLo container-structure-test \
            https://github.com/GoogleContainerTools/container-structure-test/releases/download/${{ env.CST_VERSION }}/container-structure-test-linux-arm64
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/container-structure-test

      - name: Run structure tests
        if: inputs.run_tests
        run: |
          container-structure-test test \
            --image "${{ env.TEST_IMAGE }}" \
            --config "${{ inputs.test_config }}"

      - name: Push to ECR
        if: inputs.push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ inputs.ecr_repository_url }}:${{ steps.final_tag.outputs.image_tag }}
          build-args: ${{ inputs.build_args }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image
        if: inputs.push && inputs.sign
        uses: sbe-devops/security-actions/.github/actions/sign@v0.1.0
        with:
          image-ref: ${{ inputs.ecr_repository_url }}@${{ steps.push.outputs.digest }}

      - name: Attest SBOM
        if: inputs.push && inputs.sbom
        uses: sbe-devops/security-actions/.github/actions/attest@v0.1.0
        with:
          image-ref: ${{ inputs.ecr_repository_url }}@${{ steps.push.outputs.digest }}
          sbom-file: ${{ steps.sbom.outputs.sbom-file }}
