name: Self-test

# standards/github-actions.md: "Library repos must self-test — including a failing
# case." This repo had none. Every green check on every PR here was an autolabeler
# and a release draft, and `cert-issue.yml` shipped and failed on its FIRST real
# dispatch with `[Errno 13] Permission denied: '/var/log/letsencrypt'`.
#
# ⚠️ WHAT THIS DOES AND DOES NOT COVER — read before trusting a green tick.
#
#   COVERED: every `run:` block is valid bash; the workflows parse; certbot can
#   actually be installed and can create its own directories as the runner user.
#
#   NOT COVERED: anything needing AWS. No image is built or pushed, no parameter
#   is written, no certificate is issued. The `docker-*` workflows have no
#   behavioural test here and will not until there is an OIDC role and a scratch
#   ECR in sbe-tst.
#
# That second list is a SCOPED gap, not a blanket one. Treating "no behavioural CI"
# as one indivisible blocker needing AWS is exactly why the Errno 13 shipped:
# reproducing it needed no credentials, no DNS and no domain, and nobody looked.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Every run block is valid bash
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # A syntax error in an embedded `run:` block is invisible until the step
      # executes — which, for a workflow_call-only repo, means invisible until a
      # consumer runs it in their pipeline.
      - name: Parse every run block
        run: |
          set -euo pipefail
          fail=0
          for f in .github/workflows/*.yml; do
            python3 - "$f" <<'PY' > "${RUNNER_TEMP}/blocks.txt"
          import sys, yaml, re, json
          w = yaml.safe_load(open(sys.argv[1]))
          out = []
          for jn, j in (w.get("jobs") or {}).items():
              for i, s in enumerate(j.get("steps") or []):
                  if "run" in s:
                      body = re.sub(r"\$\{\{[^}]*\}\}", "PLACEHOLDER", s["run"])
                      out.append({"job": jn, "step": s.get("name", f"#{i}"), "body": body})
          print(json.dumps(out))
          PY
            n=$(jq 'length' "${RUNNER_TEMP}/blocks.txt")
            for i in $(seq 0 $((n - 1))); do
              name=$(jq -r ".[$i].job + \" / \" + .[$i].step" "${RUNNER_TEMP}/blocks.txt")
              jq -r ".[$i].body" "${RUNNER_TEMP}/blocks.txt" > "${RUNNER_TEMP}/block.sh"
              if ! bash -n "${RUNNER_TEMP}/block.sh" 2>"${RUNNER_TEMP}/err"; then
                echo "::error file=$f::$name — $(cat "${RUNNER_TEMP}/err")"
                fail=1
              fi
            done
            echo "  ✓ $(basename "$f"): $n run block(s)"
          done
          [ "$fail" -eq 0 ] || exit 1

  certbot:
    name: certbot runs as the runner user
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # THE REGRESSION TEST. cert-issue.yml shipped defaulting to certbot's
      # /etc/letsencrypt, /var/lib/letsencrypt and /var/log/letsencrypt — all
      # root-owned, and a runner is not root. It failed on the first real
      # dispatch, and reproducing it needs NO credentials, NO DNS and NO domain.
      - name: Install certbot the way cert-issue.yml does
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            certbot certbot-dns-route53
          certbot --version

      - name: certbot must not fail on permissions
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/certbot-test"
          mkdir -p "$work"

          # This is EXPECTED to fail — there are no Route53 credentials here. The
          # assertion is on WHICH failure: it must get far enough to be a
          # credentials problem, which means it created its directories as the
          # runner user first.
          set +e
          out=$(certbot certonly --dns-route53 --non-interactive --agree-tos \
                  --email test@example.invalid --cert-name selftest --key-type ecdsa \
                  --config-dir "$work/config" --work-dir "$work/work" --logs-dir "$work/logs" \
                  --staging -d selftest.example.invalid 2>&1)
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::certbot unexpectedly SUCCEEDED against example.invalid — this test proves nothing now, fix it"
            exit 1
          fi

          if grep -qiE 'Permission denied|Errno 13|run as root' <<<"$out"; then
            echo "::error::certbot hit a PERMISSION error — the exact failure that shipped in v0.12.0."
            echo "::error::The --config-dir/--work-dir/--logs-dir flags are missing or point somewhere unwritable."
            echo "$out" | tail -20
            exit 1
          fi

          # Prove it actually created what it was told to, rather than failing
          # before it tried.
          [ -d "$work/logs" ] || { echo "::error::certbot never created its logs dir — it failed earlier than expected"; exit 1; }

          echo "✓ certbot ran as the runner user and failed on credentials, which is the correct failure here"

  gate:
    name: gate
    if: always()
    needs: [shell, certbot]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      # Aggregate, so branch protection names ONE check that survives jobs being
      # added or renamed — and, because it runs with `always()`, can never leave a
      # PR waiting on a check that never arrives.
      - name: Verify no upstream job failed
        run: |
          set -euo pipefail
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a self-test job failed"
            exit 1
          fi
          echo "✓ gate open"
