name: Docker Deploy

on:
  workflow_call:
    inputs:
      role_arn:
        description: IAM role ARN to assume for deployment (OIDC)
        required: true
        type: string
      aws_region:
        description: AWS region
        required: false
        type: string
        default: us-east-1
      ssm_image_tag_param:
        description: SSM Parameter Store path to write the image tag (e.g. /moby-trading/kraken/image-tag)
        required: true
        type: string
      image_tag:
        description: Image tag to deploy (e.g. v0.3.1)
        required: true
        type: string
      ec2_instance_tag_key:
        description: EC2 tag key used to find the target instance (e.g. Project)
        required: true
        type: string
      ec2_instance_tag_value:
        description: EC2 tag value used to find the target instance (e.g. moby-trading)
        required: true
        type: string
      service_name:
        description: systemd service name to restart on the EC2 instance
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Update image tag in SSM
        run: |
          aws ssm put-parameter \
            --name "${{ inputs.ssm_image_tag_param }}" \
            --value "${{ inputs.image_tag }}" \
            --type String \
            --overwrite
          echo "SSM ${{ inputs.ssm_image_tag_param }} → ${{ inputs.image_tag }}"

      - name: Restart service on EC2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:${{ inputs.ec2_instance_tag_key }},Values=${{ inputs.ec2_instance_tag_value }}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running instance found for tag ${{ inputs.ec2_instance_tag_key }}=${{ inputs.ec2_instance_tag_value }}"
            exit 1
          fi
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"systemctl restart ${{ inputs.service_name }}\"]"
          echo "Deployed ${{ inputs.image_tag }} → $INSTANCE_ID (service: ${{ inputs.service_name }})"
