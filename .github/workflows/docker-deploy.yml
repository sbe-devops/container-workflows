name: Docker Deploy

# Deploy a Docker-on-EC2 service by writing DESIRED state and waiting for the
# instance to publish OBSERVED state matching it. CI never executes anything on
# the box.
#
# ⚠️ WHY THERE IS NO `ssm:SendCommand` HERE — do not "simplify" this back.
# A deploy role holding SendCommand on AWS-RunShellScript holds arbitrary root
# execution on the instance. Root there inherits the instance profile, which can
# read the whole `/<service>/*` parameter tree — including parameters the deploy
# role itself is not permitted to read. That is a four-step escalation whose last
# three steps are automatic, reachable by anything able to trigger this workflow.
#
# The CD role needs exactly two actions:
#   ssm:PutParameter  <ssm_image_tag_param>       desired
#   ssm:GetParameter  <ssm_running_image_param>   observed
#
# No SendCommand. No ec2:DescribeInstances. No shell. No instance lookup — which
# also removes the whole class of "the deploy targeted the wrong box, or nothing"
# tag-filter bugs.
#
# 🔗 REQUIRES tf-aws-ec2-docker >= v0.4.0, with `ssm_running_image_param` set
#    and `converge_interval_seconds` > 0. Without the timer nothing publishes
#    observed state and every deploy times out — correctly, because nothing has
#    been proven.
#
#    ⚠️ Do NOT pin v0.3.17. It is a DRAFT release with no git tag —
#    `refs/tags/v0.3.17` returns 404, so `?ref=v0.3.17` cannot resolve and
#    `terraform init` fails. It appears between v0.3.16 and v0.4.0 in the
#    release list and looks real. Use v0.4.0.

on:
  workflow_call:
    inputs:
      role_arn:
        description: IAM role ARN to assume (OIDC). Needs only the two SSM actions above.
        required: true
        type: string
      aws_region:
        description: AWS region
        required: false
        type: string
        default: us-east-1
      ssm_image_tag_param:
        description: SSM parameter holding the DESIRED image tag (e.g. /lorem/image-tag).
        required: true
        type: string
      ssm_running_image_param:
        description: >-
          SSM parameter the instance publishes OBSERVED state to, as JSON:
          {tag, image, digest, instance_id, observed_at, healthy}. Read from
          `docker inspect` by tf-aws-ec2-docker's converge script — deliberately
          not an echo of the desired tag. Module output: `running_image_param`.
        required: true
        type: string
      image_tag:
        description: >-
          Tag to deploy. Must be the tag ACTUALLY PUSHED — if the build used
          version_extract_command, pass `needs.build.outputs.image_tag`, not the
          raw release tag, or convergence will correctly never happen.
        required: true
        type: string
      poll_timeout_seconds:
        description: >-
          How long to wait for convergence. Must exceed the module's
          converge_interval_seconds + image pull + container start. Default 300.
        required: false
        type: number
        default: 300
      poll_interval_seconds:
        description: Seconds between reads of the observed-state parameter.
        required: false
        type: number
        default: 10
    outputs:
      running_image:
        description: Full image ref observed running after convergence.
        value: ${{ jobs.deploy.outputs.running_image }}
      running_digest:
        description: Image digest observed running. Tags are mutable; this is the real identity.
        value: ${{ jobs.deploy.outputs.running_digest }}
      instance_id:
        description: The instance that reported convergence.
        value: ${{ jobs.deploy.outputs.instance_id }}
      converged_after_seconds:
        description: Seconds from writing desired state to observing convergence.
        value: ${{ jobs.deploy.outputs.elapsed }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04-arm
    # Hang protection, not a budget. Must exceed poll_timeout_seconds so the
    # poll's own diagnostic wins over an opaque job kill.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    outputs:
      running_image: ${{ steps.converge.outputs.running_image }}
      running_digest: ${{ steps.converge.outputs.running_digest }}
      instance_id: ${{ steps.converge.outputs.instance_id }}
      elapsed: ${{ steps.converge.outputs.elapsed }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # Captured BEFORE writing desired state. Convergence later requires
      # observed_at to have CHANGED from this value.
      #
      # ⚠️ This is what stops a same-tag redeploy passing instantly. Without it,
      # re-releasing a tag the instance is already running matches on the first
      # read, having proven nothing — a green deploy over an untouched box, which
      # is the exact failure class this workflow exists to remove.
      #
      # Comparing "changed" rather than "newer than now" is deliberate: the
      # instance's clock and the runner's are unrelated, and a skewed instance
      # would make a timestamp comparison either falsely converge or never
      # converge. The converge timer rewrites this parameter every interval, so
      # "it changed" is a sound freshness proof and needs no shared clock.
      - name: Capture prior observed state
        id: prior
        env:
          RUNNING_PARAM: ${{ inputs.ssm_running_image_param }}
        run: |
          set -euo pipefail
          prior=$(aws ssm get-parameter --name "$RUNNING_PARAM" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          prior_at=$(jq -r '.observed_at // ""' <<<"${prior:-{\}}" 2>/dev/null || echo "")
          echo "prior_observed_at=$prior_at" >> "$GITHUB_OUTPUT"
          echo "Prior observed_at: ${prior_at:-<none>}"

      - name: Write desired image tag
        env:
          PARAM: ${{ inputs.ssm_image_tag_param }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          aws ssm put-parameter --name "$PARAM" --value "$TAG" --type String --overwrite
          echo "Desired: $PARAM -> $TAG"

      - name: Wait for the instance to converge
        id: converge
        env:
          RUNNING_PARAM: ${{ inputs.ssm_running_image_param }}
          TAG: ${{ inputs.image_tag }}
          TIMEOUT: ${{ inputs.poll_timeout_seconds }}
          INTERVAL: ${{ inputs.poll_interval_seconds }}
          PRIOR_AT: ${{ steps.prior.outputs.prior_observed_at }}
        run: |
          set -euo pipefail
          start=$SECONDS
          deadline=$(( start + TIMEOUT ))
          last_summary=""
          last_state="{}"

          while [ "$SECONDS" -lt "$deadline" ]; do
            raw=$(aws ssm get-parameter --name "$RUNNING_PARAM" \
              --query Parameter.Value --output text 2>/dev/null || echo "")

            if [ -n "$raw" ] && jq -e . >/dev/null 2>&1 <<<"$raw"; then
              last_state="$raw"
              obs_tag=$(jq -r '.tag // ""'         <<<"$raw")
              healthy=$(jq -r '.healthy // false'  <<<"$raw")
              obs_at=$(jq -r  '.observed_at // ""' <<<"$raw")
              desired=$(jq -r '.desired // ""'     <<<"$raw")

              # All three must hold. Tag alone is not convergence: the instance
              # may be reporting a stale success from before this deploy, or be
              # up on the right tag but unhealthy.
              if [ "$healthy" = "true" ] && [ "$obs_tag" = "$TAG" ] && [ "$obs_at" != "$PRIOR_AT" ]; then
                elapsed=$(( SECONDS - start ))
                {
                  echo "running_image=$(jq -r '.image // ""' <<<"$raw")"
                  echo "running_digest=$(jq -r '.digest // ""' <<<"$raw")"
                  echo "instance_id=$(jq -r '.instance_id // ""' <<<"$raw")"
                  echo "elapsed=$elapsed"
                } >> "$GITHUB_OUTPUT"
                echo "Converged in ${elapsed}s"
                {
                  echo "### Deployed \`${TAG}\`"
                  echo ""
                  echo "| | |"
                  echo "|---|---|"
                  echo "| converged in | **${elapsed}s** |"
                  echo "| image | \`$(jq -r '.image' <<<"$raw")\` |"
                  echo "| digest | \`$(jq -r '.digest' <<<"$raw")\` |"
                  echo "| instance | \`$(jq -r '.instance_id' <<<"$raw")\` |"
                  echo "| observed at | \`${obs_at}\` |"
                  echo ""
                  echo "_CI wrote desired state and observed convergence. It executed nothing on the instance._"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              summary="healthy=$healthy tag='${obs_tag}' observed_at=${obs_at}"
              [ "$healthy" = "false" ] && summary="$summary (unit not up; it wanted '${desired}')"
            else
              summary="no observed state published yet"
            fi

            if [ "$summary" != "$last_summary" ]; then
              echo "  ${SECONDS}s: $summary"
              last_summary="$summary"
            fi
            sleep "$INTERVAL"
          done

          # Diagnose by WHY, not just "timed out".
          obs_tag=$(jq -r '.tag // ""'        <<<"$last_state")
          healthy=$(jq -r '.healthy // false' <<<"$last_state")
          obs_at=$(jq -r  '.observed_at // ""' <<<"$last_state")

          echo "::error::Instance did not converge on ${TAG} within ${TIMEOUT}s."
          echo "::error::Last observed state: ${last_state}"
          if [ "$last_state" = "{}" ] || [ -z "$obs_at" ]; then
            echo "::error::Nothing was ever published. Check ssm_running_image_param is set on the module,"
            echo "::error::and converge_interval_seconds > 0 — with the timer off, nothing converges."
          elif [ "$obs_at" = "$PRIOR_AT" ]; then
            echo "::error::observed_at never changed — the converge timer is not running."
            echo "::error::  systemctl status <container>-converge.timer"
          elif [ "$healthy" != "true" ]; then
            echo "::error::The instance reported UNHEALTHY — it pulled the tag but the unit did not come up."
            echo "::error::  journalctl -u <service>   (this is an application failure, not a delivery one)"
          else
            echo "::error::Converging on '${obs_tag}', not '${TAG}'. Usually image_tag does not match the"
            echo "::error::tag actually pushed to ECR — pass needs.build.outputs.image_tag."
          fi
          exit 1
