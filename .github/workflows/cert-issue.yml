name: Issue TLS Certificate

# Issue a Let's Encrypt certificate in CI, store it in S3, and PROVE the server
# is actually serving it. Implements ADR-0038 §1/§2/§6/§6a.
#
# The host has no certbot, no scheduler, no Route53 permissions and no
# /etc/letsencrypt. It fetches from S3 at unit start and nothing else. That is
# the whole point of ADR-0038: there is no renewal state to persist, no cron to
# install, and no certbot namespace to poison, because none of it is there.
#
# ⚠️ THIS WORKFLOW OBSERVES A RESTART, IT DOES NOT CAUSE ONE — deliberately.
#    CD holds `s3:PutObject` and `ssm:GetParameter` and nothing else. It does not
#    hold `ssm:SendCommand` and must not: a deploy role with SendCommand on
#    AWS-RunShellScript holds arbitrary root on the instance, which inherits the
#    instance profile. That is ADR-0037's decision and this workflow does not
#    reopen it.
#
#    Something MODULE-SIDE must notice the new object and restart the unit —
#    `ExecStartPre` then re-fetches. This workflow waits for the served
#    fingerprint to change, so it is correct whichever trigger the module uses
#    and needs no change when that lands.
#
# 🔗 REQUIRES tf-aws-ec2-docker >= v0.5.0. Two things, both shipped there:
#    `tls_fingerprint` / `tls_not_after` in the observed-state parameter
#    (ADR-0038 §6a), and the converge timer comparing the S3 object's ETag so a
#    certificate change restarts the unit at all. Against an earlier module this
#    publishes correctly and then times out — nothing restarts, so ExecStartPre
#    never re-fetches. The timeout diagnostic says exactly that.

on:
  workflow_call:
    inputs:
      role_arn:
        description: >-
          IAM role to assume (OIDC). Needs Route53 for the DNS-01 challenge,
          s3:PutObject on <s3_prefix>/* , and ssm:GetParameter on the observed-state
          parameter. No SendCommand. No s3:GetObject — this role publishes, the
          instance reads.
          ⚠️ If the bucket uses a customer-managed KMS key (`tf-aws-s3`'s opt-in
          `kms_key_arn`, ADR-0038 §6), this role ALSO needs `kms:GenerateDataKey*`
          on that key — PutObject into an SSE-KMS bucket fails with AccessDenied
          without it, and the message names the S3 action rather than the key.
        required: true
        type: string
      aws_region:
        description: AWS region.
        required: false
        type: string
        default: us-east-1
      domains:
        description: >-
          Comma-separated SANs, e.g. "example.com,www.example.com,api.example.com".
          ⚠️ Let's Encrypt's duplicate-certificate limit is 5 per week per EXACT
          name set — changing this list starts a fresh budget, re-running with the
          same list spends the existing one.
        required: true
        type: string
      email:
        description: Let's Encrypt account email for expiry notices.
        required: true
        type: string
      s3_bucket:
        description: >-
          Certificate bucket. ⚠️ ONE PER ACCOUNT, not per engagement — `tst` and `prd`
          are separate accounts, so each has its own and neither reaches across the
          boundary (ADR-0038 §6c, corrected 2026-08-18). Named
          `<first-class-domain, dots→hyphens>-<environment>-tls`, e.g.
          `fitbks-io-tst-tls`; derived by `tf-aws-s3` >= v0.2.0 from
          domain/environment/purpose rather than passed as a string. Key prefixes
          separate SERVICES; they do not separate environments.
        required: true
        type: string
      s3_prefix:
        description: >-
          Object key prefix, the service name. Writes <prefix>/fullchain.pem and
          <prefix>/privkey.pem — the exact keys the module's fetch script reads.
        required: true
        type: string
      ssm_running_image_param:
        description: >-
          The instance's observed-state parameter. Read to prove the SERVED
          certificate changed. Module output: `running_image_param`.
        required: true
        type: string
      poll_timeout_seconds:
        description: >-
          How long to wait for the server to serve the new certificate. Budget for
          TWO converge ticks, not one: the timer must first notice the changed S3
          ETag and restart the unit, and the NEW fingerprint is only published on
          the tick after that. So `2 x converge_interval_seconds` + image pull +
          container start, with headroom. The 600s default is comfortable at the
          module's default 30s interval.
        required: false
        type: number
        default: 600
      poll_interval_seconds:
        description: Seconds between reads of the observed-state parameter.
        required: false
        type: number
        default: 15
      staging:
        description: >-
          Use Let's Encrypt STAGING. Certificates are untrusted by browsers but do
          not consume the production rate limit. Use for the first run against a
          new engagement, and for any debugging.
        required: false
        type: boolean
        default: false
    outputs:
      fingerprint:
        description: SHA-256 fingerprint of the issued certificate, as the module reports it.
        value: ${{ jobs.issue.outputs.fingerprint }}
      not_after:
        description: Expiry of the issued certificate.
        value: ${{ jobs.issue.outputs.not_after }}
      served:
        description: >-
          "true" only when the SERVED fingerprint was observed to match.
          ⚠️ In practice a caller only ever sees "true": the wait step exits 1 when
          it does not converge, so the job fails and downstream `needs` do not run.
          The "false" path exists so the value is never a lie, not as something to
          branch on — if you want to tolerate a non-converged publish, you need
          `continue-on-error` on the calling job, and you should think hard about
          why.
        value: ${{ jobs.issue.outputs.served }}

jobs:
  issue:
    name: Issue, publish, and prove served
    # Serialize per SERVICE, and never cancel.
    #
    # Two concurrent runs for the same service is not a theoretical race — a
    # monthly `schedule` firing while someone dispatches manually is the ordinary
    # way to get one, and it is exactly when someone is dispatching.
    #
    # What happens without this: both runs issue a certificate (spending TWO of
    # Let's Encrypt's 5-per-week duplicate budget), both publish, and the loser's
    # `Wait until the server is serving it` never sees ITS fingerprint — so it
    # times out and reports a restart-path failure while the system is healthy and
    # serving the other certificate. A false failure with a misleading diagnostic.
    #
    # Worse if the two uploads interleave: `privkey.pem` from one run and
    # `fullchain.pem` from the other. §6b's reader validation catches the mismatch
    # and falls back to the cache, so it is not an outage — but the certificate
    # silently never updates and both runs fail confusingly.
    #
    # Keyed on bucket+prefix rather than the workflow, so two different services
    # do not block each other; two runs for the SAME service must.
    #
    # cancel-in-progress: false — cancelling mid-issue burns a rate-limit unit for
    # a certificate nobody receives, and can leave exactly the half-published pair
    # described above. Same reasoning as sync-peers.yml.
    concurrency:
      group: cert-issue-${{ inputs.s3_bucket }}-${{ inputs.s3_prefix }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    # Hang protection, not a budget. Must exceed poll_timeout_seconds so the
    # poll's own diagnostic wins over an opaque job kill.
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    outputs:
      fingerprint: ${{ steps.issue.outputs.fingerprint }}
      not_after: ${{ steps.issue.outputs.not_after }}
      served: ${{ steps.serve.outputs.served }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      # Captured BEFORE publishing. Convergence later requires the served
      # fingerprint to have CHANGED from this, not merely to equal the new one —
      # otherwise re-running with an unchanged certificate would pass instantly
      # having proven nothing, which is the same false-green `docker-deploy.yml`
      # avoids with observed_at.
      - name: Capture the currently served certificate
        id: prior
        env:
          PARAM: ${{ inputs.ssm_running_image_param }}
        run: |
          set -euo pipefail
          raw=$(aws ssm get-parameter --name "$PARAM" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          fp=$(jq -r '.tls_fingerprint // ""' <<<"${raw:-{\}}" 2>/dev/null || echo "")
          na=$(jq -r '.tls_not_after // ""'   <<<"${raw:-{\}}" 2>/dev/null || echo "")
          echo "prior_fp=$fp" >> "$GITHUB_OUTPUT"
          echo "Currently served: ${fp:-<none>}  (expires ${na:-<unknown>})"

      - name: Install certbot with the Route53 DNS plugin
        run: |
          set -euo pipefail
          # pip, not a curl of a binary: versioned, checksummed by the index, and
          # removable. standards/github-actions.md forbids the inline-curl shape.
          python3 -m pip install --quiet --disable-pip-version-check \
            certbot certbot-dns-route53
          certbot --version

      # DNS-01 rather than HTTP-01: no inbound port 80, and it is the only
      # challenge that works for a host that is not publicly reachable.
      - name: Issue the certificate
        id: issue
        env:
          DOMAINS: ${{ inputs.domains }}
          EMAIL: ${{ inputs.email }}
          STAGING: ${{ inputs.staging }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra names <<<"$DOMAINS"
          for n in "${names[@]}"; do
            n="$(echo "$n" | tr -d '[:space:]')"
            [ -n "$n" ] && args+=(-d "$n")
          done
          [ ${#args[@]} -gt 0 ] || { echo "::error::no domains parsed from '$DOMAINS'"; exit 1; }

          extra=()
          if [ "$STAGING" = "true" ]; then
            extra+=(--staging)
            echo "::warning::STAGING certificate — untrusted by browsers. Does not spend the production rate limit."
          fi

          # --config-dir/--work-dir/--logs-dir, not sudo. certbot's own
          # defaults (/etc/letsencrypt, /var/lib/letsencrypt,
          # /var/log/letsencrypt) require root; the runner user has none.
          # certbot's own error message names both fixes -- this one avoids
          # a second problem sudo would introduce: AWS_* creds (this step's
          # whole DNS-01 auth) live in the calling user's environment, and a
          # bare `sudo` resets that environment by default. `sudo -E` would
          # work too, IF the runner's sudoers preserves it -- writable dirs
          # sidestep needing to know either way.
          # RUNNER_TEMP, not mktemp -d. Both are writable, but they are not the
          # same guarantee: RUNNER_TEMP is the platform's designated per-job
          # scratch and the runner cleans it between jobs, whereas /tmp is
          # writable by accident of the host and — on a SELF-HOSTED runner —
          # persists across jobs and is shared with everything else on the box.
          # This step writes a TLS PRIVATE KEY, so "works because the runner
          # happens to be ephemeral" is not a property to depend on.
          #
          # It is also the convention every other SBE workflow already uses
          # (sync-peers.yml, validate-pr.yml). See standards/github-actions.md,
          # "Scratch space".
          certbot_home="${RUNNER_TEMP}/certbot"
          mkdir -p "$certbot_home"
          certbot certonly \
            --dns-route53 \
            --non-interactive --agree-tos \
            --email "$EMAIL" \
            --cert-name sbe \
            --key-type ecdsa \
            --config-dir "$certbot_home/config" \
            --work-dir "$certbot_home/work" \
            --logs-dir "$certbot_home/logs" \
            "${args[@]}" "${extra[@]+"${extra[@]}"}"

          live="$certbot_home/config/live/sbe"
          cp "$live/fullchain.pem" "$live/privkey.pem" .
          chmod 600 privkey.pem

          # EXACTLY the command tf-aws-ec2-docker's converge script uses to
          # populate tls_fingerprint. If these two ever diverge the comparison
          # below silently never matches, and the deploy reads as a broken
          # workflow rather than a broken contract.
          fp=$(openssl x509 -in fullchain.pem -noout -fingerprint -sha256 | cut -d= -f2)
          na=$(openssl x509 -in fullchain.pem -noout -enddate | cut -d= -f2)
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "not_after=$na"   >> "$GITHUB_OUTPUT"
          echo "Issued $fp (expires $na)"

      # ADR-0038 §6b is a READER obligation, but publishing a mismatched pair in
      # the first place is a writer defect. Cheap to check here, and it means a
      # broken pair never reaches the bucket at all.
      - name: Verify the pair before publishing
        run: |
          set -euo pipefail
          cert_spki=$(openssl x509 -in fullchain.pem -noout -pubkey | openssl sha256)
          key_spki=$(openssl pkey -in privkey.pem -pubout | openssl sha256)
          if [ "$cert_spki" != "$key_spki" ]; then
            echo "::error::certificate and private key do not match — refusing to publish."
            echo "::error::Publishing this pair would leave nginx unable to start."
            exit 1
          fi
          if ! openssl x509 -in fullchain.pem -noout -checkend 0 >/dev/null; then
            echo "::error::the certificate certbot just issued is already expired or invalid."
            echo "::error::  notAfter: $(openssl x509 -in fullchain.pem -noout -enddate 2>&1)"
            echo "::error::Check the runner clock before suspecting Let's Encrypt."
            exit 1
          fi
          echo "✓ pair matches and the certificate is currently valid"

      # Key first, then certificate. The two objects are written separately, so a
      # reader can observe a half-published set; the module validates the pair and
      # falls back to its cache, so either order is safe. Key-first means the
      # window shows new-key + old-cert, which fails the module's check for the
      # same reason as the reverse — stated so the order is not "re-tidied" later
      # on the assumption that it is arbitrary.
      - name: Publish to S3
        env:
          BUCKET: ${{ inputs.s3_bucket }}
          PREFIX: ${{ inputs.s3_prefix }}
          REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          aws s3 cp privkey.pem    "s3://$BUCKET/$PREFIX/privkey.pem"    --region "$REGION" --only-show-errors
          aws s3 cp fullchain.pem  "s3://$BUCKET/$PREFIX/fullchain.pem"  --region "$REGION" --only-show-errors
          echo "Published to s3://$BUCKET/$PREFIX/"
          rm -f privkey.pem fullchain.pem

      # §6a. The assertion that makes §3a's cache fallback visible instead of
      # silent: a container that started from cache CAME UP, so liveness proves
      # nothing. Only the served fingerprint does.
      - name: Wait until the server is serving it
        id: serve
        env:
          PARAM: ${{ inputs.ssm_running_image_param }}
          WANT: ${{ steps.issue.outputs.fingerprint }}
          PRIOR: ${{ steps.prior.outputs.prior_fp }}
          TIMEOUT: ${{ inputs.poll_timeout_seconds }}
          INTERVAL: ${{ inputs.poll_interval_seconds }}
        run: |
          set -euo pipefail

          # An empty WANT would match an instance that has NO certificate
          # installed -- tls_fingerprint is "" there too -- and pass having proven
          # the opposite of what it claims. `set -euo pipefail` on the issue step
          # should make this impossible; this is the assertion that says so rather
          # than assuming it.
          [ -n "$WANT" ] || { echo "::error::issued fingerprint is empty — refusing to assert against it"; exit 1; }

          start=$SECONDS
          deadline=$(( start + TIMEOUT ))
          last=""
          state="{}"

          while [ "$SECONDS" -lt "$deadline" ]; do
            raw=$(aws ssm get-parameter --name "$PARAM" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
            if [ -n "$raw" ] && jq -e . >/dev/null 2>&1 <<<"$raw"; then
              state="$raw"
              fp=$(jq -r '.tls_fingerprint // ""' <<<"$raw")
              healthy=$(jq -r '.healthy // false' <<<"$raw")
              # All three. `fp = WANT` alone is not proof: if a future change ever
              # reuses a certificate across runs -- caching certbot's config dir to
              # save Let's Encrypt budget is the obvious one, and the rate limit
              # makes it likely -- then WANT could equal what was ALREADY being
              # served, and this would pass instantly having observed nothing.
              # Requiring it to differ from PRIOR is what makes that impossible
              # rather than merely unlikely. The comment on the `prior` step has
              # claimed this property since v0.12.0; the code did not implement it.
              if [ "$fp" = "$WANT" ] && [ "$fp" != "$PRIOR" ] && [ "$healthy" = "true" ]; then
                elapsed=$(( SECONDS - start ))
                echo "served=true" >> "$GITHUB_OUTPUT"
                echo "Serving the new certificate after ${elapsed}s"
                {
                  echo "### TLS certificate live"
                  echo ""
                  echo "| | |"
                  echo "|---|---|"
                  echo "| fingerprint | \`${WANT}\` |"
                  echo "| expires | ${{ steps.issue.outputs.not_after }} |"
                  echo "| observed serving after | **${elapsed}s** |"
                  echo ""
                  echo "_Verified against the certificate the server is actually serving, not against liveness._"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              summary="served=${fp:-<none>} healthy=$healthy"
            else
              summary="no observed state published yet"
            fi
            [ "$summary" != "$last" ] && { echo "  ${SECONDS}s: $summary"; last="$summary"; }
            sleep "$INTERVAL"
          done

          served_fp=$(jq -r '.tls_fingerprint // ""' <<<"$state")
          echo "served=false" >> "$GITHUB_OUTPUT"
          echo "::error::The certificate was published to S3 but the server is not serving it."
          echo "::error::Issued:  ${WANT}"
          echo "::error::Serving: ${served_fp:-<none>}"
          echo "::error::"
          if [ -n "$served_fp" ] && [ "$served_fp" = "$PRIOR" ]; then
            echo "::error::The served fingerprint has not moved at all. The most likely cause is that"
            echo "::error::NOTHING RESTARTED THE UNIT. The certificate only reaches nginx via"
            echo "::error::ExecStartPre, which re-runs on restart. From tf-aws-ec2-docker v0.5.0 the"
            echo "::error::converge timer restarts on a changed S3 ETag — BELOW v0.5.0 it restarts only"
            echo "::error::on a changed image tag, and a certificate refresh changes no tag, so it will"
            echo "::error::never pick this up. Check the module version FIRST."
            echo "::error::On v0.5.0+, suspect instead: the converge timer not running"
            echo "::error::(systemctl status <container>-converge.timer), or the instance role missing"
            echo "::error::s3:GetObject on the bucket, which fails the fetch silently into the cache."
            echo "::error::"
          fi
          echo "::error::⚠️ DO NOT simply re-run. The certificate is already published and re-issuing"
          echo "::error::spends the Let's Encrypt duplicate limit (5/week per exact name set). Fix the"
          echo "::error::restart path; the object in S3 is already correct."
          exit 1
