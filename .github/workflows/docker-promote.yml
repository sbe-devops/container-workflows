name: Promote Image to Latest

on:
  workflow_call:
    inputs:
      ecr_repository_url:
        description: Full ECR repository URL (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/my-image)
        required: true
        type: string
      role_arn:
        description: IAM role ARN to assume for ECR operations (OIDC)
        required: true
        type: string
      image_tag:
        description: Version tag to promote to latest (e.g. v1.1.0)
        required: true
        type: string
      aws_region:
        description: AWS region for ECR
        required: false
        type: string
        default: us-east-1

jobs:
  promote:
    name: Promote ${{ inputs.image_tag }} → latest
    runs-on: ubuntu-24.04-arm
    # Hang protection, not a budget — retag/copy only; observed max 3 min.
    # Without this a stuck job runs to GitHub's 360-minute default.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      # 🔴 CALLER INPUTS ARE DATA. Every value reaches a script through env: and is quoted,
      # never pasted into run: with an expression (tests/no-expr-in-run.py fails the build if
      # one is). image_tag is also held to Docker's tag grammar here, BEFORE any credentialed
      # step: a tag like `v1$(…)` is refused, not run (PROOF, corp 1a99223).
      - name: Check caller inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag is not a valid image tag (letters, digits, _ . -, at most 128, not starting with . or -)"
            exit 1
          fi
          echo "✓ image_tag $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Promote to latest
        env:
          ECR_REPOSITORY_URL: ${{ inputs.ecr_repository_url }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          REPO_NAME=$(echo "$ECR_REPOSITORY_URL" | cut -d'/' -f2-)

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageManifest' \
            --output text)

          if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
            echo "ERROR: Tag $IMAGE_TAG not found in $REPO_NAME"
            exit 1
          fi

          aws ecr put-image \
            --repository-name "$REPO_NAME" \
            --image-tag latest \
            --image-manifest "$MANIFEST"

          echo "✓ Promoted $IMAGE_TAG → latest in $REPO_NAME"
